name: Source line endings

on:
  push:
  pull_request:

jobs:
  check-line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check source files use LF endings
        run: python scripts/check_line_endings.py
