server:
  port: 17234
  # Bind to all interfaces so phones/tablets on the same Wi-Fi can open
  # LumiPOS at http://<this-pc-ip>:17234. Windows Firewall may still need an
  # inbound rule for TCP 17234 on first run.
  address: 0.0.0.0

spring:
  application:
    name: bms-sqlite

  datasource:
    # SQLite = zero-config, zero-daemon embedded file DB. The query params are
    # applied by sqlite-jdbc's SQLiteConfig on every pooled connection:
    #   journal_mode=WAL  -> read/write concurrency without full DB lock
    #   busy_timeout=10000 -> wait up to 10s instead of failing "database is locked"
    #   synchronous=NORMAL -> fast fsync policy (durable enough for POS data)
    #
    # Path: %LOCALAPPDATA%\LumiPOS\data\lumipos.db (per-user, hidden, writable
    # without admin). SqliteDataDirMigration (META-INF/spring.factories) creates
    # that directory and copies an existing C:\LumiPOS\lumipos.db into it on the
    # first start after upgrading, then overrides this value. The literal below
    # is the pre-migration location and only survives if no legacy file exists.
    url: "jdbc:sqlite:C:/LumiPOS/lumipos.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL"
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: PRAGMA busy_timeout=10000

  jpa:
    hibernate:
      # SQLite is migrated by SqliteSchemaMigrator from db/sqlite/schema.sql, not by
      # Hibernate. ddl-auto: update reads the whole schema through
      # DatabaseMetaData.getColumns(null, null, null, null), which sqlite-jdbc compiles
      # into a compound SELECT with one term per column; SQLite caps those at 500 and the
      # schema is past it, so with update the app cannot start at all after the upgrade
      # that crosses the line. The migrator asks about one table at a time instead.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
        default_batch_fetch_size: 50

  # Flyway is intentionally disabled today — schema comes from Hibernate
  # ddl-auto:update. If re-enabled, SQLite migrations live here.
  flyway:
    enabled: false
    locations: classpath:db/migration/sqlite

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

logging:
  level:
    com.bms: INFO
    org.springframework.security: WARN

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

app:
  # Receipt/product images stay in C:\LumiPOS\uploads: they already exist there
  # on every current install, and moving them would break every saved image.
  # Only the database moves to the per-user data directory.
  upload-dir: C:/LumiPOS/uploads
  open-browser: false

lumipos:
  # Overrides the per-user data directory for the SQLite database.
  # Default: %LOCALAPPDATA%\LumiPOS\data (see SqliteDataDirMigration).
  data-dir: ${LUMIPOS_DATA_DIR:}
  migration:
    # One-time MySQL -> SQLite data copy. Set LUMIPOS_MIGRATE_MYSQL_TO_SQLITE=1
    # (Electron passes -Dlumipos.migration.mysql-to-sqlite=true) to trigger it.
    mysql-to-sqlite: ${LUMIPOS_MIGRATE_MYSQL_TO_SQLITE:false}
    mysql:
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/lumipos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
      username: ${MYSQL_USERNAME:lumi}
      password: ${MYSQL_PASSWORD:}
    sqlite:
      path: ${LUMIPOS_SQLITE_PATH:C:/LumiPOS/lumipos.db}