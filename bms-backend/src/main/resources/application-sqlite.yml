server:
  port: 17234
  # Bind to all interfaces so phones/tablets on the same Wi-Fi can open
  # LumiPOS at http://<this-pc-ip>:17234. Windows Firewall may still need an
  # inbound rule for TCP 17234 on first run.
  address: 0.0.0.0

spring:
  application:
    name: bms-sqlite

  datasource:
    # SQLite = zero-config, zero-daemon embedded file DB. The query params are
    # applied by sqlite-jdbc's SQLiteConfig on every pooled connection:
    #   journal_mode=WAL  -> read/write concurrency without full DB lock
    #   busy_timeout=10000 -> wait up to 10s instead of failing "database is locked"
    #   synchronous=NORMAL -> fast fsync policy (durable enough for POS data)
    url: "jdbc:sqlite:C:/LumiPOS/lumipos.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL"
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: PRAGMA busy_timeout=10000

  jpa:
    hibernate:
      # Hibernate owns the SQLite schema (same as the H2/electron profile).
      # SQLite accepts any column type name, so LONGBLOB @Lob columns create
      # BLOB-affinity columns that store byte[] correctly.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
        default_batch_fetch_size: 50

  # Flyway is intentionally disabled today — schema comes from Hibernate
  # ddl-auto:update. If re-enabled, SQLite migrations live here.
  flyway:
    enabled: false
    locations: classpath:db/migration/sqlite

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

logging:
  level:
    com.bms: INFO
    org.springframework.security: WARN

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

app:
  upload-dir: C:/LumiPOS/uploads
  open-browser: false

lumipos:
  migration:
    # One-time MySQL -> SQLite data copy. Set LUMIPOS_MIGRATE_MYSQL_TO_SQLITE=1
    # (Electron passes -Dlumipos.migration.mysql-to-sqlite=true) to trigger it.
    mysql-to-sqlite: ${LUMIPOS_MIGRATE_MYSQL_TO_SQLITE:false}
    mysql:
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/lumipos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
      username: ${MYSQL_USERNAME:lumi}
      password: ${MYSQL_PASSWORD:}
    sqlite:
      path: ${LUMIPOS_SQLITE_PATH:C:/LumiPOS/lumipos.db}