server:
  port: 17234
  address: 127.0.0.1

spring:
  application:
    name: bms-electron

  datasource:
    url: jdbc:h2:file:C:/LumiPOS/bms_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: false
      settings:
        web-allow-others: false

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: c2VjcmV0S2V5Rm9yQk1TT2ZmbGluZUFwcENyZWF0ZWRGb3JNeWF0VGh1cmFTb2UyMDI2
  expiration: 86400000

logging:
  level:
    com.bms: INFO
    org.springframework.security: WARN

google:
  oauth:
    client-id: haha
    client-secret: 123
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

app:
  upload-dir: C:/LumiPOS/uploads
  open-browser: false
