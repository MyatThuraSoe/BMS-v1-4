server:
  port: 17234
  # Bind to all interfaces so phones/tablets on the same Wi-Fi can open
  # LumiPOS at http://<this-pc-ip>:17234. Windows Firewall may still need an
  # inbound rule for TCP 17234 on first run.
  address: 0.0.0.0

spring:
  application:
    name: bms-electron

  datasource:
    url: jdbc:h2:file:C:/LumiPOS/bms_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: false
      settings:
        web-allow-others: false

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  # Unused for signing (JwtSecretService uses C:/LumiPOS/jwt.secret). No hardcoded
  # value is shipped; leave this as an env override only.
  secret: ${JWT_SECRET:}
  expiration: 86400000

logging:
  level:
    com.bms: INFO
    org.springframework.security: WARN

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

app:
  upload-dir: C:/LumiPOS/uploads
  open-browser: false
