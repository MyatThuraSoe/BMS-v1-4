spring:
  application:
    name: bms-electron

  datasource:
    url: jdbc:h2:file:C:/BMS_Data/bms_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
