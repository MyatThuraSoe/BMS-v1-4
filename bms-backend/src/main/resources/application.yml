server:
  port: 17234
  address: 0.0.0.0

spring:
  application:
    name: bms-backend
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:mysql://localhost:3306/bms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: myat
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Hibernate only checks the schema matches entities — never changes it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: MySecureSecretKeyForJWTTokenGeneration2026!
  expiration: 86400000

logging:
  level:
    com.bms: DEBUG
    org.springframework.security: INFO

google:
  oauth:
    client-id: haha
    client-secret: 123
    redirect-uri: http://localhost:17234/api/backups/google/callback
    # Change redirect-uri to your production URL in production!
    frontend-redirect-base: http://localhost:17234
    # Change this too — it's where the browser lands after Google auth completes.
