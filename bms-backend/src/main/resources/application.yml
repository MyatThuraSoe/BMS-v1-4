server:
  port: 17234
  # Bind to loopback only by default. If you truly need LAN access, change this
  # to the specific LAN IP (or 0.0.0.0) AND use strong credentials / TLS.
  address: 127.0.0.1

spring:
  application:
    name: bms-backend
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:mysql://localhost:3306/bms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: myat
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Schema is created/updated automatically from entities — no SQL migrations needed
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    enabled: false # Schema is managed by Hibernate ddl-auto=update — no SQL migrations needed
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  # Override in production; the JWT signing key actually comes from the per-install
  # JwtSecretService file, so this is only a fallback for dev.
  secret: MySecureSecretKeyForJWTTokenGeneration2026!
  expiration: 86400000

logging:
  level:
    com.bms: DEBUG
    org.springframework.security: INFO

google:
  oauth:
    client-id: 217619565297-0igvbc0s4latr2ma2mb5kcpe9bvu3b6u.apps.googleusercontent.com
    client-secret: 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
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

   
