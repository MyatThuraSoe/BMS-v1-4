server:
  port: ${APP_PORT:17234}
  address: ${APP_SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: bms-offline

  datasource:
    url: ${APP_DB_URL:jdbc:h2:file:C:/LumiPOS/bms_db;AUTO_SERVER=TRUE}
    username: ${APP_DB_USERNAME:sa}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: ${APP_DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${APP_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: false
      settings:
        web-allow-others: false

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.bms: INFO
    org.springframework.security: WARN

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:change-me-in-production}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://127.0.0.1:17234/api/backups/google/callback}
    frontend-redirect-base: ${GOOGLE_FRONTEND_REDIRECT_BASE:http://127.0.0.1:17234}

app:
  upload-dir: ${APP_UPLOAD_DIR:C:/LumiPOS/uploads}