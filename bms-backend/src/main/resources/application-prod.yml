server:
  port: 17234
  # [CHANGE 1] Security: Restrict to localhost only.
  address: 127.0.0.1

spring:
  application:
    name: bms-offline

  datasource:
    # [CHANGE 2] Switch to local file-based H2 database (No MySQL required)
    url: jdbc:h2:file:C:/LumiPOS/bms_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Note: 'update' works, but 'none' is safer once your schema is finalized
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # [CHANGE 3] Switch Hibernate dialect to H2
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false # Disable formatting to save CPU

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # H2 web console is disabled in production (only reachable from a connected
  # client locally anyway; leaving it on widens the attack surface for no benefit).
  h2:
    console:
      enabled: false
      settings:
        web-allow-others: false

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  # Unused for signing (JwtSecretService uses C:/LumiPOS/jwt.secret). No hardcoded
  # value is shipped; override via environment variable if needed.
  secret: MySecureSecretKeyForJWTTokenGeneration2026!
  expiration: 86400000

logging:
  level:
    com.bms: INFO # [CHANGE 4] Change to INFO to prevent massive log files on customer PCs
    org.springframework.security: WARN

google:
  oauth:
    client-id: 217619565297-0igvbc0s4latr2ma2mb5kcpe9bvu3b6u.apps.googleusercontent.com
    client-secret: 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
    redirect-uri: http://127.0.0.1:17234/api/backups/google/callback
    frontend-redirect-base: http://127.0.0.1:17234

# [CHANGE 7] Custom property for saving product images and expense receipts locally
app:
  upload-dir: C:/LumiPOS/uploads